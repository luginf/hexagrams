<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yi Jing</title>
<style>
/* ── Themes ───────────────────────────────────────────────────────────── */
body {
  --bg:#fdf6e3;--bg-left:#f5efe0;--fg:#3b2e1e;--fg2:#8a7060;
  --sep:#c8b89a;--line:#3b2e1e;--tri-bg:#faf0d8;--tri-border:#c8b89a;
  --accent:#7a4f28;--btn-bg:#d8c9a8;--btn-fg:#3b2e1e;
}
body[data-theme=light]{
  --bg:#ffffff;--bg-left:#fafafa;--fg:#1a1a1a;--fg2:#999;
  --sep:#ddd;--line:#1a1a1a;--tri-bg:#f9f9f9;--tri-border:#ccc;
  --accent:#8B1A1A;--btn-bg:#ebebeb;--btn-fg:#1a1a1a;
}
body[data-theme=dark]{
  --bg:#1e1e1e;--bg-left:#252525;--fg:#d4d4d4;--fg2:#666;
  --sep:#3a3a3a;--line:#c8c8c8;--tri-bg:#2a2a2a;--tri-border:#484848;
  --accent:#c8965a;--btn-bg:#333;--btn-fg:#d4d4d4;
}
body[data-theme=sepia]{
  --bg:#fdf6e3;--bg-left:#f5efe0;--fg:#3b2e1e;--fg2:#8a7060;
  --sep:#c8b89a;--line:#3b2e1e;--tri-bg:#faf0d8;--tri-border:#c8b89a;
  --accent:#7a4f28;--btn-bg:#d8c9a8;--btn-fg:#3b2e1e;
}
body[data-theme=green]{
  --bg:#f0f7f0;--bg-left:#e6f2e6;--fg:#1a2e1a;--fg2:#6a896a;
  --sep:#a8c8a8;--line:#1a2e1a;--tri-bg:#e0f0e0;--tri-border:#a8c8a8;
  --accent:#2e6e2e;--btn-bg:#c8dfc8;--btn-fg:#1a2e1a;
}

/* ── Base ─────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:Helvetica,Arial,sans-serif;font-size:13px;
  display:flex;flex-direction:column;min-height:100vh;
}
#topbar,#menu-drop,.mi,#right,#mut,#mutsep,
#hex-canvas,#tri-canvas,#mut-canvas,#mut-tri,
#coins-canvas,#toss-btn,#hex-num,#mut-num,
#coin-prog,#coin-sum{user-select:none;}

/* ── Topbar ───────────────────────────────────────────────────────────── */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;background:var(--bg);position:relative;z-index:100;
}
#topbar-title{color:var(--fg2);font-size:13px;padding:6px 0}
#topbar-sep{height:1px;background:var(--sep)}

/* ── Menu ─────────────────────────────────────────────────────────────── */
#menu-btn{
  font-size:15px;cursor:pointer;padding:4px 10px;
  background:var(--bg);color:var(--fg);border-radius:3px;
}
#menu-btn:hover{background:var(--sep)}
#menu-wrap{position:relative}
#menu-drop{
  display:none;position:absolute;top:100%;right:0;
  background:var(--btn-bg);color:var(--btn-fg);
  border:1px solid var(--sep);border-radius:4px;
  min-width:220px;box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:200;
}
#menu-drop.open{display:block}
.mi{
  padding:7px 14px;cursor:pointer;position:relative;
  display:flex;align-items:center;white-space:nowrap;
}
.mi:hover{background:var(--sep);color:var(--fg)}
.mi.has-sub{justify-content:space-between}
.mi.has-sub::after{content:"▶";font-size:10px;margin-left:8px;opacity:.7}
.msep{height:1px;background:var(--sep);margin:2px 0}
.sub{
  display:none;position:absolute;top:0;right:100%;left:auto;
  background:var(--btn-bg);color:var(--btn-fg);
  border:1px solid var(--sep);border-radius:4px;
  min-width:200px;max-height:340px;overflow-y:auto;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}
.mi:hover>.sub{display:block}
.chk{width:16px;display:inline-block;flex-shrink:0}

/* ── Main ─────────────────────────────────────────────────────────────── */
#main{display:flex;align-items:flex-start;padding:12px;gap:0;flex:1}

/* ── Left ─────────────────────────────────────────────────────────────── */
#left{
  background:var(--bg-left);padding:8px 12px;
  width:282px;flex-shrink:0;
}
#left.hidden{display:none}
#info{font-size:12px;min-height:240px}
.hex-title{
  font-size:17px;font-weight:bold;color:var(--accent);
  text-align:center;margin:4px 0 10px;
}
.hex-bold{font-size:12px;font-weight:bold;text-align:center;margin-bottom:6px}
.hex-italic{font-size:12px;font-style:italic;color:var(--fg2);text-align:center}

/* ── Coins ────────────────────────────────────────────────────────────── */
#coins{display:none;margin-top:12px}
#coins-row{display:flex;align-items:center;gap:8px}
#toss-btn{
  background:var(--btn-bg);color:var(--btn-fg);border:none;
  cursor:pointer;padding:4px 10px;font-size:11px;
  font-family:inherit;border-radius:3px;
}
#toss-btn:hover{background:var(--sep)}
#toss-btn:disabled{opacity:.4;cursor:default}
#coins-sum{font-size:10px;color:var(--fg2)}
#coins-progress{font-size:10px;font-style:italic;color:var(--fg2);margin-top:2px}

/* ── Vsep ─────────────────────────────────────────────────────────────── */
#vsep{width:1px;background:var(--sep);align-self:stretch;flex-shrink:0}
#vsep.hidden{display:none}

/* ── Right ────────────────────────────────────────────────────────────── */
#right{display:flex;flex-direction:column;align-items:center;padding:10px 12px;flex-shrink:0}
#right-mid{display:flex}
#hex-canvas{cursor:pointer;display:block}
#tri-canvas{display:block;margin-left:4px}
#tri-canvas.hidden{display:none}
#hex-num{font-size:22px;font-weight:bold;color:var(--accent);margin:4px 0 14px;min-height:28px}

/* ── Mut panel ────────────────────────────────────────────────────────── */
#mutsep{width:1px;background:var(--sep);align-self:stretch;flex-shrink:0}
#mutsep.hidden{display:none}
#mut{display:flex;flex-direction:column;align-items:center;padding:10px 12px;flex-shrink:0}
#mut.hidden{display:none}
#mut-mid{display:flex}
#mut-canvas{display:block}
#mut-tri{display:block;margin-left:4px}
#mut-tri.hidden{display:none}
#mut-num{
  font-size:14px;font-weight:bold;color:var(--accent);
  margin:4px 0 14px;cursor:pointer;min-height:20px;
}
#mut-num:hover{text-decoration:underline}
#mut-mode-btn{
  background:var(--btn-bg);color:var(--btn-fg);border:none;
  cursor:pointer;padding:4px 14px;font-size:13px;
  font-family:inherit;border-radius:3px;margin-bottom:8px;
  display:none;
}
#mut-mode-btn.visible{display:inline-block}
#mut-mode-btn.active{background:var(--accent);color:var(--bg)}

/* ── Responsive ───────────────────────────────────────────────────────── */
@media(max-width:650px){
  #main{flex-direction:column;align-items:stretch}
  #left{width:auto}
  #vsep{width:auto;height:1px;align-self:auto}
  #mutsep{width:auto;height:1px;align-self:auto}
  #right,#mut{align-self:center}
}

/* ── Number dialog ────────────────────────────────────────────────────── */
#overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.3);z-index:300;
  align-items:center;justify-content:center;
}
#overlay.open{display:flex}
#num-dlg{
  background:var(--bg);border:1px solid var(--sep);border-radius:6px;
  padding:20px 24px;min-width:280px;
  display:flex;flex-direction:column;gap:10px;
}
#num-label{font-size:12px;text-align:center}
#num-slider{width:100%;accent-color:var(--accent)}
#num-spin{
  width:80px;text-align:center;font-size:15px;font-weight:bold;
  background:var(--btn-bg);color:var(--fg);
  border:1px solid var(--sep);border-radius:3px;padding:3px;
  align-self:center;font-family:inherit;
}
#num-btns{display:flex;gap:8px;justify-content:center}
#about-dlg{
  background:var(--bg);border:1px solid var(--sep);border-radius:6px;
  padding:22px 28px;max-width:340px;text-align:center;
  display:none;flex-direction:column;gap:10px;
}
#about-dlg.open{display:flex}
#about-title{font-size:15px;font-weight:bold;color:var(--accent)}
#about-desc{font-size:12px;color:var(--fg2);line-height:1.6}
#about-link{font-size:12px;color:var(--accent);text-decoration:underline;cursor:pointer}
#about-btns{display:flex;justify-content:center;margin-top:4px}
.dbtn{
  background:var(--btn-bg);color:var(--btn-fg);border:none;
  cursor:pointer;padding:5px 18px;font-size:12px;
  font-family:inherit;border-radius:3px;
}
.dbtn:hover{background:var(--sep)}
</style>
</head>

// ── Theme helper ───────────────────────────────────────────────────────────
function T(k){return getComputedStyle(document.body).getPropertyValue('--'+k).trim()}

// ── Hex logic ──────────────────────────────────────────────────────────────
function getHex(lv=lines){
  const lo=lv[1]+lv[2]*2+lv[3]*4, hi=lv[4]+lv[5]*2+lv[6]*4;
  return HEX_TABLE[hi*8+lo];
}
function getMutLines(){
  const ml={};for(let i=1;i<=6;i++)ml[i]=lines[i]^muts[i];return ml;
}
function hasMuts(){for(let i=1;i<=6;i++)if(muts[i])return true;return false;}

// ── Draw hexagram ──────────────────────────────────────────────────────────
function yOf(n){return 54+(6-n)*44}

function drawHexOn(cvs,lv,mv,blankFrom=0){
  const ctx=cvs.getContext('2d');
  const bg=T('bg');
  ctx.fillStyle=bg; ctx.fillRect(0,0,cvs.width,cvs.height);

  const sepY=yOf(4)+22;
  ctx.strokeStyle=T('sep'); ctx.lineWidth=1;
  ctx.setLineDash([6,3]);
  ctx.beginPath(); ctx.moveTo(20,sepY); ctx.lineTo(240,sepY); ctx.stroke();
  ctx.setLineDash([]);

  for(let i=1;i<=6;i++){
    const y=yOf(i);
    ctx.fillStyle=T('fg2'); ctx.font='9px Helvetica,Arial,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(i),13,y);

    if(blankFrom>0&&i>=blankFrom){
      ctx.strokeStyle=T('fg2'); ctx.lineWidth=1;
      ctx.setLineDash([3,6]);
      ctx.beginPath(); ctx.moveTo(32,y); ctx.lineTo(228,y); ctx.stroke();
      ctx.setLineDash([]); continue;
    }
    ctx.strokeStyle=T('line'); ctx.lineWidth=14; ctx.lineCap='butt';
    ctx.setLineDash([]);
    if(lv[i]){ctx.beginPath();ctx.moveTo(32,y);ctx.lineTo(228,y);ctx.stroke();}
    else{
      ctx.beginPath();ctx.moveTo(32,y);ctx.lineTo(108,y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(152,y);ctx.lineTo(228,y);ctx.stroke();
    }
    if(mv[i]){
      const cx=130; ctx.lineWidth=2;
      if(lv[i]){
        ctx.strokeStyle=T('accent'); ctx.fillStyle=bg;
        ctx.beginPath(); ctx.arc(cx,y,9,0,2*Math.PI); ctx.fill(); ctx.stroke();
      } else {
        ctx.strokeStyle=T('accent'); ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(cx-9,y-9);ctx.lineTo(cx+9,y+9);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx-9,y+9);ctx.lineTo(cx+9,y-9);ctx.stroke();
      }
    }
  }
}

function drawHex(){
  drawHexOn(document.getElementById('hex-canvas'),lines,muts,randLine>0?randLine:0);
}

// ── Draw trigrams ──────────────────────────────────────────────────────────
function drawTriBlock(ctx,yc,idx){
  const cx=50;
  ctx.strokeStyle=T('tri-border'); ctx.fillStyle=T('tri-bg');
  ctx.lineWidth=1; ctx.setLineDash([]);
  ctx.beginPath(); ctx.rect(5,yc-40,90,80); ctx.fill(); ctx.stroke();

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=T('accent');
  ctx.font='bold 17px Helvetica,Arial,sans-serif';
  ctx.fillText(TRI_SYM[idx],cx,yc-22);

  ctx.fillStyle=T('fg');
  ctx.font='15px Helvetica,Arial,sans-serif';
  ctx.fillText(TRI_HANZI[idx],cx,yc-2);

  ctx.fillStyle=T('fg2');
  ctx.font='11px Helvetica,Arial,sans-serif';
  ctx.fillText(TRI_PINYIN[idx],cx,yc+15);

  ctx.font='italic 10px Helvetica,Arial,sans-serif';
  ctx.fillText(TRI_NAMES[lang][idx],cx,yc+31);
}

function drawTrisOn(cvs,lv){
  const ctx=cvs.getContext('2d');
  ctx.fillStyle=T('bg'); ctx.fillRect(0,0,cvs.width,cvs.height);
  const sepY=yOf(4)+22;
  ctx.strokeStyle=T('sep'); ctx.lineWidth=1; ctx.setLineDash([6,3]);
  ctx.beginPath(); ctx.moveTo(0,sepY); ctx.lineTo(100,sepY); ctx.stroke();
  ctx.setLineDash([]);
  const lo=lv[1]+lv[2]*2+lv[3]*4, hi=lv[4]+lv[5]*2+lv[6]*4;
  drawTriBlock(ctx,98,hi); drawTriBlock(ctx,230,lo);
}
function drawTris(){drawTrisOn(document.getElementById('tri-canvas'),lines);}

// ── Custom PRNG (xorshift32, seeded from click timestamp) ─────────────────
// Re-seeded on each toss via performance.now() + Date.now() mix, so the
// exact moment of the click influences the outcome (equivalent of srand).
let _rngState = 0xdeadbeef;
function rngSeed(seed) { _rngState = (seed >>> 0) || 1; }
function rngNext() {
  _rngState ^= _rngState << 13;
  _rngState ^= _rngState >>> 17;
  _rngState ^= _rngState << 5;
  return (_rngState >>> 0) / 0x100000000;
}

// ── Coin toss ──────────────────────────────────────────────────────────────
function drawCoinCvs(coins){
  const cvs=document.getElementById('coins-canvas');
  const ctx=cvs.getContext('2d');
  ctx.fillStyle=T('bg-left'); ctx.fillRect(0,0,cvs.width,cvs.height);
  coins.forEach((v,i)=>{
    const cx=15+i*30, cy=15;
    const lbl=v===2?(lang==='zh'?'字':lang==='en'?'T':'P')
                   :(lang==='zh'?'花':lang==='en'?'H':'F');
    if(v===3){
      ctx.fillStyle=T('accent'); ctx.strokeStyle=T('accent');
      ctx.beginPath(); ctx.arc(cx,cy,11,0,2*Math.PI); ctx.fill();
      ctx.fillStyle=T('bg');
    } else {
      ctx.fillStyle=T('bg-left'); ctx.strokeStyle=T('accent');
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx,cy,11,0,2*Math.PI); ctx.fill(); ctx.stroke();
      ctx.fillStyle=T('accent');
    }
    ctx.font='bold 8px Helvetica,Arial,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(lbl,cx,cy);
  });
}
function updateCoinsUI(coins,sum){
  randCoins=coins; randSum=sum;
  drawCoinCvs(coins);
  document.getElementById('coins-sum').textContent=sum>0?LINE_TYPE[lang][sum]:'';
  document.getElementById('coins-progress').textContent=
    randLine>6?UI[lang].done:(randLine>=1?UI[lang].lineProgress(randLine):'');
}
function hideCoinPanel(){
  randLine=0; randCoins=[]; randSum=0;
  document.getElementById('coins').style.display='none';
  applyInfoVis();
}
function startRandom(){
  for(let i=1;i<=6;i++){lines[i]=0;muts[i]=0;}
  randLine=1; randCoins=[]; randSum=0;
  refresh();
  document.getElementById('left').classList.remove('hidden');
  document.getElementById('vsep').classList.remove('hidden');
  const c=document.getElementById('coins');
  c.style.display='block';
  const btn=document.getElementById('toss-btn');
  btn.disabled=false; btn.textContent=UI[lang].toss;
  updateCoinsUI([],0);
}
function tossCoins(){
  if(randLine<1||randLine>6)return;
  rngSeed(Math.floor((performance.now() + Date.now()) * 1000) ^ (randLine * 0x9e3779b9));
  const coins=Array.from({length:3},()=>rngNext()<.5?2:3);
  const sum=coins.reduce((a,b)=>a+b,0);
  const n=randLine;
  lines[n]=sum===7||sum===9?1:0;
  muts[n] =sum===6||sum===9?1:0;
  randLine++;
  updateCoinsUI(coins,sum);
  refresh();
  if(randLine>6){
    document.getElementById('toss-btn').disabled=true;
    setTimeout(hideCoinPanel,2000);
  }
}

// ── Number dialog ──────────────────────────────────────────────────────────
function openNumDialog(){
  document.getElementById('about-dlg').classList.remove('open');
  document.getElementById('num-dlg').style.display='';
  document.getElementById('num-label').textContent=UI[lang].numLabel;
  document.getElementById('num-ok').textContent=UI[lang].ok;
  document.getElementById('num-cancel').textContent=UI[lang].cancel;
  document.getElementById('num-slider').value=1;
  document.getElementById('num-spin').value=1;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('num-spin').focus();
}

// ── About dialog ───────────────────────────────────────────────────────────
function showAbout(){
  document.getElementById('num-dlg').style.display='none';
  document.getElementById('about-desc').textContent=UI[lang].aboutDesc;
  document.getElementById('about-close').textContent=UI[lang].close;
  document.getElementById('about-dlg').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

// ── Menu builder ───────────────────────────────────────────────────────────
function closeMenu(){document.getElementById('menu-drop').classList.remove('open');}

function buildMenu(){
  const md=document.getElementById('menu-drop');
  md.innerHTML='';
  const u=UI[lang];

  function mi(label,fn){
    const d=document.createElement('div'); d.className='mi';
    d.innerHTML=label;
    if(fn)d.addEventListener('click',e=>{e.stopPropagation();fn();closeMenu();});
    md.appendChild(d); return d;
  }
  function sep(){const d=document.createElement('div');d.className='msep';md.appendChild(d);}
  function check(label,getV,fn){
    const d=document.createElement('div'); d.className='mi';
    const upd=()=>{d.innerHTML=`<span class="chk">${getV()?'✓':''}</span>${label}`;};
    upd();
    d.addEventListener('click',e=>{e.stopPropagation();fn();upd();});
    md.appendChild(d);
  }
  function sub(label,items){
    const d=document.createElement('div'); d.className='mi has-sub';
    d.innerHTML=`<span>${label}</span>`;
    const s=document.createElement('div'); s.className='sub';
    items.forEach(([l,f])=>{
      const it=document.createElement('div'); it.className='mi';
      it.textContent=l;
      it.addEventListener('click',e=>{e.stopPropagation();f();closeMenu();});
      s.appendChild(it);
    });
    d.appendChild(s); md.appendChild(d);
  }
  function cascade(label,groups){
    const d=document.createElement('div'); d.className='mi has-sub';
    d.innerHTML=`<span>${label}</span>`;
    const s=document.createElement('div'); s.className='sub';
    groups.forEach(([gl,items])=>{
      const g=document.createElement('div'); g.className='mi has-sub';
      g.innerHTML=`<span>${gl}</span>`;
      const ss=document.createElement('div'); ss.className='sub';
      items.forEach(([l,f])=>{
        const it=document.createElement('div'); it.className='mi';
        it.textContent=l;
        it.addEventListener('click',e=>{e.stopPropagation();f();closeMenu();});
        ss.appendChild(it);
      });
      g.addEventListener('mouseenter',()=>{
        const r=g.getBoundingClientRect(), vw=window.innerWidth, vh=window.innerHeight;
        ss.style.position='fixed';
        ss.style.right=(vw-r.left)+'px';
        ss.style.left='auto';
        ss.style.top=Math.min(r.top, vh-340)+'px';
        ss.style.bottom='auto';
      });
      g.appendChild(ss); s.appendChild(g);
    });
    d.appendChild(s); md.appendChild(d);
  }

  const names=TRI_NAMES[lang];
  cascade(u.hexNav, Array.from({length:8},(_,lo)=>[
    TRI_SYM[lo]+' '+names[lo],
    Array.from({length:8},(_,hi)=>{
      const num=HEX_TABLE[hi*8+lo], d=HD[lang][num];
      return [TRI_SYM[hi]+' '+names[hi]+' — '+(d?d[0]:'#'+num),
              ()=>setHexFromTris(hi,lo)];
    })
  ]));

  mi(u.gotoNum, openNumDialog);
  sep();
  mi(u.random, startRandom);
  mi(u.reset,  resetAll);
  sep();
  check(u.trigrams, ()=>showTrigrams, ()=>{showTrigrams=!showTrigrams;applyTriVis();});
  check(u.showInfo, ()=>showInfo,     ()=>{showInfo=!showInfo;applyInfoVis();});
  check(u.mutNav,    ()=>mutNavMode,    ()=>{mutNavMode=!mutNavMode;savePrefs();});
  check(u.show_mut_btn,()=>showMutBtn,()=>{showMutBtn=!showMutBtn;applyMutBtnVis();});
  sep();
  sub(u.lang,[['Français',()=>setLang('fr')],['English',()=>setLang('en')],['中文',()=>setLang('zh')]]);
  sub(u.theme,[['light',()=>applyTheme('light')],['dark',()=>applyTheme('dark')],
               ['sepia',()=>applyTheme('sepia')],['green',()=>applyTheme('green')]]);
  sep();
  mi(u.about, showAbout);
}

// ── Boot ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  loadPrefs();
  document.body.dataset.theme=theme;
  buildMenu();

  document.getElementById('menu-btn').addEventListener('click',e=>{
    e.stopPropagation();
    document.getElementById('menu-drop').classList.toggle('open');
  });
  document.addEventListener('click',()=>closeMenu());

  const hc=document.getElementById('hex-canvas');
  hc.addEventListener('click',e=>{
    const r=hc.getBoundingClientRect();
    const y=e.clientY-r.top;
    for(let i=1;i<=6;i++)if(Math.abs(y-yOf(i))<=20){
      if(mutMode){muts[i]^=1;}else{lines[i]^=1;}
      refresh();return;
    }
  });
  hc.addEventListener('contextmenu',e=>{
    e.preventDefault();
    const r=hc.getBoundingClientRect();
    const y=e.clientY-r.top;
    for(let i=1;i<=6;i++)if(Math.abs(y-yOf(i))<=20){muts[i]^=1;refresh();return;}
  });
  document.getElementById('mut-mode-btn').addEventListener('click',toggleMutMode);

  document.getElementById('mut-num').addEventListener('click',applyMut);
  document.getElementById('toss-btn').addEventListener('click',tossCoins);

  // Number dialog sync
  const sl=document.getElementById('num-slider'), sp=document.getElementById('num-spin');
  sl.addEventListener('input',()=>sp.value=sl.value);
  sp.addEventListener('input',()=>{
    const v=Math.min(64,Math.max(1,parseInt(sp.value)||1));
    sl.value=v;
  });
  document.getElementById('num-ok').addEventListener('click',()=>{
    const n=parseInt(sp.value);
    if(n>=1&&n<=64){
      const idx=HEX_TABLE.indexOf(n);
      if(idx>=0)setHexFromTris(Math.floor(idx/8),idx%8);
    }
    document.getElementById('overlay').classList.remove('open');
  });
  document.getElementById('num-cancel').addEventListener('click',()=>{
    document.getElementById('overlay').classList.remove('open');
  });
  document.getElementById('about-close').addEventListener('click',()=>{
    document.getElementById('about-dlg').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  });
  document.getElementById('overlay').addEventListener('click',e=>{
    if(e.target===document.getElementById('overlay')){
      document.getElementById('about-dlg').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }
  });
  sp.addEventListener('keydown',e=>{
    if(e.key==='Enter')document.getElementById('num-ok').click();
    if(e.key==='Escape')document.getElementById('num-cancel').click();
  });

  applyTriVis();
  applyInfoVis();
  applyMutBtnVis();
  refresh();
});
</script>
